<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · MJ Streaming</title>
<style>
:root{--bg:#050914;--bg2:#0a1124;--card:#0d1530;--line:rgba(255,255,255,.1);--txt:#f5f7ff;--muted:#98a3c7;--y:#ffe93a;--g:#8dff2e;--pink:#ff3d8b;--grad:linear-gradient(95deg,#ffe93a,#8dff2e)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:.6rem .75rem;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--y)}
input[type=checkbox]{width:auto;accent-color:#8dff2e}
input[type=color]{padding:2px;height:40px;width:56px;cursor:pointer}
textarea{resize:vertical;min-height:70px}
label{display:grid;gap:5px;font-size:.82rem;color:var(--muted);font-weight:600}
label.ck{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.6rem 1.05rem;border-radius:11px;font-weight:700;font-size:.92rem;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--y);color:var(--y)}
.btn.p{background:var(--grad);color:#07101f;border:0}
.btn.p:hover{color:#07101f;filter:brightness(1.08)}
.btn.d:hover{border-color:var(--pink);color:var(--pink)}
.btn.sm{padding:.4rem .7rem;font-size:.82rem}
.btn:disabled{opacity:.45;pointer-events:none}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(380px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;gap:14px;text-align:center}
.lbox h1{font-size:1.4rem}
.err{color:#ff6b7d;font-size:.88rem;min-height:1.2em}
.top{position:sticky;top:0;z-index:20;background:rgba(5,9,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{font-size:1.05rem;margin-right:auto}
.chip{font-size:.78rem;padding:.3rem .7rem;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:#8dff2e;border-color:rgba(141,255,46,.4)}
.chip.warn{color:#ffc14d;border-color:rgba(255,193,77,.5)}
.chip.bad{color:#ff6b7d;border-color:rgba(255,107,125,.5)}
.tabs{max-width:1100px;margin:auto;padding:0 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:.7rem 1rem;color:var(--muted);font-weight:600;font-size:.9rem;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--y);border-color:var(--y)}
main{max-width:1100px;margin:auto;padding:18px 16px 120px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.card h2{font-size:1.05rem;margin-bottom:12px}
.grid2{display:grid;gap:12px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)!important}}
.grid3{display:grid;gap:12px}
.help{font-size:.82rem;color:var(--muted)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{width:auto;flex:1;min-width:150px}
.prow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px;margin-bottom:10px}
.prow.off{opacity:.55}
.thumb{width:56px;height:56px;border-radius:13px;overflow:hidden;display:grid;place-items:center;font-weight:900;color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover}
.pinfo b{display:block}
.pinfo small{color:var(--muted)}
.pact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pact .st{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.pact .st input{width:74px;padding:.35rem .5rem}
@media(min-width:760px){.prow{grid-template-columns:56px 1fr auto}.pact{grid-column:auto}}
.row{display:grid;gap:8px;grid-template-columns:1fr 1fr auto;align-items:end;margin-bottom:8px}
.row.r4{grid-template-columns:1fr 1fr 1fr auto}
.row.r2{grid-template-columns:1fr auto}
.row.faq{grid-template-columns:1fr;border:1px solid var(--line);border-radius:12px;padding:10px}
.pub{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:10px;padding:12px;background:linear-gradient(transparent,rgba(5,9,20,.96) 35%);pointer-events:none}
.pub>*{pointer-events:auto}
dialog{border:0;background:transparent;color:inherit;max-width:100vw;margin:auto;overflow:visible}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
.dlg{width:min(760px,94vw);max-height:92dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px}
.dlg h2{font-size:1.2rem}
.imgbox{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.imgprev{aspect-ratio:16/10;border-radius:13px;overflow:hidden;display:grid;place-items:center;font-weight:900;text-align:center;color:#fff;padding:6px;border:1px solid var(--line)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.imgprev img.contain{object-fit:contain}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);background:#0d1530;border:1px solid var(--y);padding:.65rem 1.1rem;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:92%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--pink)}
.hist{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
code{background:rgba(255,255,255,.08);padding:.1rem .4rem;border-radius:6px}
[hidden]{display:none!important}
/* inventario */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.stat{position:relative;border-radius:16px;padding:12px 14px;color:#fff;cursor:pointer;overflow:hidden;border:2px solid transparent;transition:.2s;text-align:left;min-height:96px}
.stat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55));pointer-events:none}
.stat>*{position:relative;z-index:1}
.stat:hover{transform:translateY(-2px)}
.stat.on{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,233,58,.25)}
.stat b{display:block;font-size:.9rem;text-shadow:0 1px 4px #000}
.stat .n{font-size:1.9rem;font-weight:900;line-height:1.1}
.stat .n small{font-size:.72rem;font-weight:600;opacity:.9;margin-left:4px}
.stat .sub{font-size:.72rem;opacity:.9}
.stat .tag{position:absolute;top:8px;right:8px;z-index:2;font-size:.64rem;font-weight:800;padding:.15rem .45rem;border-radius:99px;background:#ff6b7d;color:#fff}
.stat .tag.w{background:#ffc14d;color:#2a1a00}
.mbar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.2);margin-top:6px}
.mbar i{display:block;height:100%}
.arows{display:grid;gap:8px;margin:12px 0}
.ahead,.arow{display:grid;grid-template-columns:1.6fr 1.2fr 1fr .8fr 38px;gap:8px;align-items:end}
.ahead span{font-size:.74rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-left:4px}
.arow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.arow label small{display:none}
.arow input{background:rgba(0,0,0,.25)}
.arow .num{display:none}
@media(max-width:760px){.ahead{display:none}.arow{grid-template-columns:1fr 1fr}.arow label small{display:block;font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase}.arow .em{grid-column:1/-1}.arow .rm{grid-column:1/-1}}
.acc{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:15px;padding:12px;margin-bottom:10px}
.acc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:.72rem;font-weight:800;padding:.2rem .6rem;border-radius:99px;background:color-mix(in srgb,var(--sc) 20%,transparent);color:var(--sc);border:1px solid color-mix(in srgb,var(--sc) 50%,transparent)}
.acc-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fld{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:11px;padding:7px 10px;display:grid;gap:2px;position:relative;min-width:0}
.fld small{font-size:.66rem;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.fld code{background:none;padding:0;font-size:.92rem;word-break:break-all;color:#fff}
.fld code.pw{color:var(--g)}
.fld code.pn{color:var(--y);font-weight:800;letter-spacing:.12em}
.fld .cp{position:absolute;top:6px;right:6px;font-size:.78rem;opacity:.6;padding:2px 5px;border-radius:7px}
.fld .cp:hover{opacity:1;background:rgba(255,255,255,.1)}
.fld.empty code{color:var(--muted);font-style:italic}
.acc-a{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gh{margin:18px 0 8px;font-size:.95rem;color:var(--y)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:.35rem .8rem;border-radius:99px;border:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--grad);color:#07101f;border:0}
/* temas */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard2{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);display:grid}
.tcard2.on{border-color:var(--g);box-shadow:0 0 0 3px rgba(141,255,46,.2)}
.tprev{height:118px;position:relative;padding:10px;display:grid;align-content:space-between;overflow:hidden}
.tprev .lt{display:flex;gap:6px}.tprev .lt i{width:9px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor}
.tprev .bt{justify-self:start;font-size:.74rem;font-weight:900;padding:.3rem .7rem;border-radius:99px}
.tprev .em{position:absolute;right:10px;bottom:4px;font-size:3rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.tprev .fl{position:absolute;inset:0;font-size:1rem;opacity:.7;letter-spacing:.9em;line-height:2.3;overflow:hidden;pointer-events:none}
.tinfo{padding:10px 12px;display:grid;gap:6px}
.tinfo b{font-size:.98rem}
.tinfo .tb{display:flex;gap:6px;flex-wrap:wrap}
.ok-badge{color:var(--g);font-size:.78rem;font-weight:800}
.audit{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.9rem;display:grid;gap:4px}
.audit.ok{background:rgba(141,255,46,.1);border:1px solid rgba(141,255,46,.4)}
.audit.bad{background:rgba(255,107,125,.1);border:1px solid rgba(255,107,125,.45)}
.socprev{font-size:.78rem;color:var(--muted);margin-top:6px;word-break:break-all}
.socprev.ok{color:var(--g)}.socprev.bad{color:#ff6b7d}

</style>
</head>
<body>

<div id="login">
  <form class="lbox" onsubmit="doLogin(event)">
    <h1>🍿 Panel MJ Streaming</h1>
    <p class="help">Ingresa tu contraseña de administrador</p>
    <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" autofocus>
    <button class="btn p" type="submit">Entrar</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <h1>🍿 Panel · <span id="tn">MJ Streaming</span></h1>
      <span class="chip" id="stDirty">✔ Todo publicado</span>
      <span class="chip" id="stGh" hidden></span>
      <a class="btn sm" href="/" target="_blank" rel="noopener">👁 Ver tienda</a>
      <button class="btn sm d" onclick="logout()">Salir</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="view"></main>
  <div class="pub"><button class="btn p" id="pubBtn" onclick="publish()" disabled>🚀 Publicar cambios</button></div>
</div>

<dialog id="ed"><div class="dlg" id="edBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
let DATA=null, dirty=false, tab="productos", q="", fcat="";

async function api(path,{json,body,method}={}){
  const opt={method:method||(json||body?"POST":"GET"),credentials:"same-origin",headers:{"X-Admin":"1"}};
  if(json!==undefined){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(json);} else if(body) opt.body=body;
  const r=await fetch(path,opt); let j={}; try{j=await r.json()}catch(e){}
  if(r.status===401&&!path.includes("login")){showLogin();throw new Error("Sesión vencida: vuelve a entrar");}
  if(!r.ok) throw new Error(j.error||("Error "+r.status));
  return j;
}
let tt; function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="toast on"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),bad?4500:2200);}
function showLogin(){$("#app").hidden=true;$("#login").hidden=false;}

async function doLogin(e){
  e.preventDefault(); $("#lerr").textContent="";
  try{ await api("/api/admin/login",{json:{password:$("#pw").value}}); $("#pw").value=""; await start(); }
  catch(err){ $("#lerr").textContent=err.message; }
}
async function logout(){ try{await api("/api/admin/logout",{json:{}});}catch(e){} location.reload(); }

/* ---------- datos ---------- */
function prepare(d){
  d.config=d.config||{}; d.config.redes=d.config.redes||{}; d.config.pagos=d.config.pagos||[]; d.config.descuentos=d.config.descuentos||[];
  d.config._cup=Object.entries(d.config.cupones||{}).map(([c,p])=>({c,p}));
  d.products=d.products||[]; d.testimonios=d.testimonios||[]; d.faq=d.faq||[]; d.terminos=d.terminos||"";
  return d;
}
function payload(){
  const d=JSON.parse(JSON.stringify(DATA)); const cup={};
  (d.config._cup||[]).forEach(x=>{ if(x.c&&x.c.trim()) cup[x.c.trim().toUpperCase()]=+x.p||0; });
  d.config.cupones=cup; delete d.config._cup;
  d.products.forEach(p=>delete p._auto);
  return d;
}
function mark(v=true){ dirty=v; $("#pubBtn").disabled=!v; const c=$("#stDirty"); c.textContent=v?"● Cambios sin publicar":"✔ Todo publicado"; c.className="chip "+(v?"warn":"ok"); }
async function start(){
  DATA=prepare(await api("/api/admin/catalogo"));
  $("#login").hidden=true; $("#app").hidden=false; $("#tn").textContent=DATA.config.tienda||"";
  mark(false); render(); estado();
}
async function publish(){
  const b=$("#pubBtn"); b.disabled=true; b.textContent="Publicando…";
  try{ DATA=prepare(await api("/api/admin/catalogo",{method:"PUT",json:payload()})); mark(false); $("#tn").textContent=DATA.config.tienda||""; render(); toast("✔ Publicado. La tienda se actualiza sola en unos segundos"); setTimeout(estado,2500); }
  catch(e){ toast(e.message,true); b.disabled=false; }
  b.textContent="🚀 Publicar cambios";
}
async function estado(){
  try{ const e=await api("/api/admin/estado"); const c=$("#stGh"); if(!e.github){c.hidden=true;return;}
    c.hidden=false; c.textContent=(e.sync.ok===false?"⚠ ":"☁ ")+e.sync.msg; c.className="chip "+(e.sync.ok===false?"bad":"ok"); }catch(e){}
}
setInterval(()=>{ if(!$("#app").hidden) estado(); },15000);
window.addEventListener("beforeunload",e=>{ if(dirty){e.preventDefault();e.returnValue="";} });

/* ---------- pestañas ---------- */
const TABS=[["productos","📦 Productos"],["inventario","🔐 Inventario"],["pedidos","🧾 Pedidos"],["pagos","💳 Pagos Bold"],["temas","🎨 Temas"],["tienda","⚙️ Tienda"],["ofertas","💸 Ofertas y pagos"],["faq","❓ Preguntas"],["terminos","📜 Términos"],["testi","⭐ Testimonios"],["respaldo","💾 Respaldo"]];
function render(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" data-t="${k}">${l}</button>`).join("");
  $("#view").innerHTML=({productos:vProductos,inventario:vInventario,pedidos:vPedidos,pagos:vPagos,temas:vTemas,tienda:vTienda,ofertas:vOfertas,faq:vFaq,terminos:vTerminos,testi:vTesti,respaldo:vRespaldo})[tab]();
  if(tab==="respaldo") loadHist();
  if(tab==="tienda") socPrev();
  if(tab==="inventario"){ renderAdd(); loadInv(); }
  if(tab==="pedidos") loadOrd();
  if(tab==="pagos") loadPagos();
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]"); if(b){tab=b.dataset.t;render();}});

/* campos simples enlazados por ruta: data-k="config.tienda" */
function setPath(path,val){
  const keys=path.split("."); let o=DATA; for(let i=0;i<keys.length-1;i++) o=o[keys[i]]; o[keys[keys.length-1]]=val;
}
$("#view").addEventListener("input",e=>{
  const el=e.target.closest("[data-k]"); if(!el) return;
  let v=el.type==="checkbox"?el.checked:el.value;
  if(el.dataset.t==="lines") v=String(v).split("\n").map(x=>x.trim()).filter(Boolean);
  if(el.dataset.t==="num") v=v===""?"":+v;
  setPath(el.dataset.k,v); mark(); if(tab==="tienda") socPrev();
});
const val=(path)=>path.split(".").reduce((o,k)=>o?.[k],DATA);
const inp=(label,path,extra="")=>`<label>${label}<input data-k="${path}" value="${esc(val(path))}" ${extra}></label>`;
const txt=(label,path,rows=3)=>`<label>${label}<textarea rows="${rows}" data-k="${path}">${esc(val(path))}</textarea></label>`;

/* ---------- Productos ---------- */
function vProductos(){
  const cats=[...new Set(DATA.products.map(p=>p.cat))];
  const list=DATA.products.map((p,i)=>({p,i})).filter(({p})=>(!fcat||p.cat===fcat)&&(p.name+" "+p.cat).toLowerCase().includes(q.toLowerCase()));
  return `<div class="bar">
    <input id="pq" placeholder="🔎 Buscar producto" value="${esc(q)}" oninput="q=this.value;renderList()">
    <select onchange="fcat=this.value;renderList()"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${c===fcat?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <button class="btn p" onclick="editP(-1)">➕ Nuevo producto</button></div>
    <p class="help" style="margin-bottom:12px">Tip: el orden de esta lista es el de la tienda (los marcados 🔥 salen primero). Cambia stock o visibilidad aquí mismo y pulsa <b>Publicar cambios</b>.</p>
    <div id="plist">${rowsP(list)}</div>`;
}
function rowsP(list){
  if(!list.length) return `<p class="help">No hay productos que coincidan.</p>`;
  return list.map(({p,i})=>{
    const img=p.img||p._auto, min=Math.min(...p.plans.map(x=>+x.p||0));
    return `<div class="prow ${p.oculto?"off":""}">
      <div class="thumb" style="background:linear-gradient(135deg,${p.c1},${p.c2})">${img?`<img src="${esc(img)}" alt="">`:esc((p.name||"?").slice(0,2))}</div>
      <div class="pinfo"><b>${esc(p.name)} ${p.hot?"🔥":""}</b><small>${esc(p.cat)} · ${esc(p.tipo)} · ${p.plans.length} plan(es) · desde ${fmt(min)}</small></div>
      <div class="pact">
        <label class="st">Stock <input type="number" min="0" placeholder="∞" value="${p.stock??""}" onchange="DATA.products[${i}].stock=this.value===''?null:+this.value;mark()"></label>
        <label class="ck st"><input type="checkbox" ${p.oculto?"":"checked"} onchange="DATA.products[${i}].oculto=!this.checked;mark();renderList()"> Visible</label>
        <button class="btn sm" onclick="editP(${i})">✏️ Editar</button>
        <button class="btn sm" onclick="moveP(${i},-1)" title="Subir">↑</button>
        <button class="btn sm" onclick="moveP(${i},1)" title="Bajar">↓</button>
        <button class="btn sm" onclick="dupP(${i})" title="Duplicar">⧉</button>
        <button class="btn sm d" onclick="delP(${i})" title="Eliminar">🗑</button>
      </div></div>`;
  }).join("");
}
function renderList(){
  const list=DATA.products.map((p,i)=>({p,i})).filter(({p})=>(!fcat||p.cat===fcat)&&(p.name+" "+p.cat).toLowerCase().includes(q.toLowerCase()));
  $("#plist").innerHTML=rowsP(list);
}
function moveP(i,d){const j=i+d; if(j<0||j>=DATA.products.length) return; [DATA.products[i],DATA.products[j]]=[DATA.products[j],DATA.products[i]]; mark(); renderList();}

async function upImg(inp){
  const f=inp.files[0]; if(!f) return;
  const id=EP.id||slug($("#e_name").value)||("producto-"+Date.now()); EP.id=id;
  try{
    const bmp=await createImageBitmap(f), m=1000, k=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,"image/webp",.88));
    const fd=new FormData(); fd.append("id",id); fd.append("file",blob,"img.webp");
    const r=await api("/api/admin/imagen",{body:fd}); EP.img=r.url; $("#e_img").value=r.url; prev(); toast("✔ Imagen subida");
  }catch(e){ toast(e.message||"No se pudo subir la imagen",true); }
  inp.value="";
}
async function rmImg(){
  const id=EP.id||slug($("#e_name").value);

}

    <div id="socPrev"></div></div>`;

const SOCB={instagram:"https://www.instagram.com/",tiktok:"https://www.tiktok.com/@",facebook:"https://www.facebook.com/"};
function socUrl(k,v){
  v=String(v||"").trim(); if(!v) return "";
  if(!/^https?:\/\//i.test(v)){
    if(/^(www\.)?[a-z0-9-]+\.[a-z]{2,}(\/|$)/i.test(v)) v="https://"+v;
    else{ const h=v.replace(/^[@\/\s]+/,"").split("?")[0].replace(/\/+$/,""); if(!/^[A-Za-z0-9._-]{1,60}$/.test(h)) return null; v=SOCB[k]+h; }
  }
  return v;
}
function socPrev(){
  const el=$("#socPrev"); if(!el) return;
  el.innerHTML=["instagram","tiktok","facebook"].map(k=>{const raw=(DATA.config.redes||{})[k]; if(!String(raw||"").trim()) return ""; const u=socUrl(k,raw);
    return u?`<div class="socprev ok">✔ ${k}: ${esc(u)}</div>`:`<div class="socprev bad">✖ ${k}: no es un usuario ni un enlace válido</div>`;}).join("");

function importJ(inp){
  const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ DATA=prepare(JSON.parse(r.result)); mark(); render(); toast("Importado. Revisa y pulsa Publicar"); }catch(e){ toast("Archivo inválido",true); } };

/* ===================== INVENTARIO ===================== */
let INV=[], ORD=[], invPid="", invSt="", invQ="", ordF="todos";
let ROWS=[{email:"",password:"",perfil:"",pin:""}], addPid="", aPlan="", PASTE=false, REVEAL=new Set();
const STC={disponible:{t:"Libre",c:"#8dff2e"},reservada:{t:"Reservada",c:"#ffc14d"},vendida:{t:"Vendida",c:"#6aa7ff"},bloqueada:{t:"Bloqueada",c:"#ff6b7d"}};
const OSL={pendiente:["Esperando pago","warn"],pagado:["Pagado · procesando","warn"],entregado:["Entregado","ok"],manual:["Entrega manual pendiente","warn"],sin_stock:["Pagado SIN STOCK","bad"],error_correo:["Error al enviar correo","bad"],monto_distinto:["Monto distinto","bad"],error_bold:["Error con Bold","bad"],cancelado:["Cancelado",""],expirado:["Expirado",""]};
const PROB=["sin_stock","error_correo","monto_distinto","error_bold"];
const dt=t=>t?new Date(t*1000).toLocaleString("es-CO",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const prod=id=>DATA.products.find(p=>p.id===id)||{name:id,c1:"#2f7bff",c2:"#0b1020",plans:[]};
const pname=id=>prod(id).name;

function vInventario(){
  if(!addPid||!DATA.products.some(p=>p.id===addPid)) addPid=(DATA.products[0]||{}).id||"";
  return `<div id="invStats" class="stats"></div>
  <div class="card"><h2>➕ Agregar cuentas</h2><div id="addForm"></div></div>
  <div class="card"><h2>📦 Todas las cuentas</h2>
    <div class="bar"><input id="invQ" placeholder="🔎 Buscar por correo, perfil, pedido…" value="${esc(invQ)}" oninput="invQ=this.value;renderInv()"></div>
    <div class="chips" id="invChips"></div><div id="invList">Cargando…</div></div>`;
}
function renderAdd(){
  const el=$("#addForm"); if(!el) return; const p=prod(addPid);
  el.innerHTML=`<div class="grid2"><label>1 · Producto<select onchange="addPid=this.value;aPlan='';renderAdd()">${DATA.products.map(x=>`<option value="${esc(x.id)}" ${x.id===addPid?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
    <label>2 · ¿Para qué plan? <select onchange="aPlan=this.value"><option value="">Cualquier plan</option>${(p.plans||[]).map(pl=>`<option ${pl.l===aPlan?"selected":""}>${esc(pl.l)}</option>`).join("")}</select></label></div>
    <p class="help" style="margin-top:12px"><b>3 · Datos de cada cuenta.</b> Cada fila es <u>un perfil que se vende</u>. Si una cuenta tiene 4 perfiles, escribe 4 filas con el mismo correo y distinto perfil/PIN. Perfil y PIN son opcionales (para cuentas completas déjalos vacíos).</p>
    <div class="arows"><div class="ahead"><span>🔑 Cuenta (correo)</span><span>🔒 Contraseña</span><span>👤 Perfil</span><span>#️⃣ PIN</span><span></span></div>
    ${ROWS.map((r,i)=>`<div class="arow"><label class="em"><small>Cuenta</small><input data-r="${i}" data-f="email" placeholder="cuenta@gmail.com" value="${esc(r.email)}" autocomplete="off"></label>
      <label><small>Contraseña</small><input data-r="${i}" data-f="password" placeholder="contraseña" value="${esc(r.password)}" autocomplete="off"></label>
      <label><small>Perfil</small><input data-r="${i}" data-f="perfil" placeholder="Perfil 1" value="${esc(r.perfil)}" autocomplete="off"></label>
      <label><small>PIN</small><input data-r="${i}" data-f="pin" placeholder="1234" value="${esc(r.pin)}" inputmode="numeric" autocomplete="off"></label>
      <button class="btn sm d rm" onclick="delRow(${i})" title="Quitar fila" ${ROWS.length<2?"disabled":""}>✕</button></div>`).join("")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn" onclick="addRow()">➕ Otra fila</button><button class="btn" onclick="PASTE=!PASTE;renderAdd()">📋 Pegar varias desde Excel</button>
      <span style="flex:1"></span><button class="btn p" onclick="saveRows()">💾 Guardar ${ROWS.filter(r=>r.email||r.password).length||""} cuenta(s)</button></div>
    ${PASTE?`<div style="margin-top:12px;display:grid;gap:8px"><p class="help">Copia las columnas <b>Cuenta · Contraseña · Perfil · PIN</b> de tu Excel/Sheets y pégalas aquí (también sirve <code>cuenta|clave|perfil|pin</code>).</p>
      <textarea id="pasteBox" rows="5" placeholder="cuenta1@gmail.com&#9;Clave123&#9;Perfil 1&#9;1111"></textarea><div><button class="btn" onclick="pasteRows()">Convertir en filas</button></div></div>`:""}`;
}
$("#view").addEventListener("input",e=>{ const i=e.target.closest("[data-r]"); if(i){ ROWS[+i.dataset.r][i.dataset.f]=i.value; } });
$("#view").addEventListener("keydown",e=>{
  const i=e.target.closest("[data-r]"); if(!i||e.key!=="Enter") return; e.preventDefault();
  const F=["email","password","perfil","pin"], r=+i.dataset.r, k=F.indexOf(i.dataset.f);
  if(k<3) return $(`[data-r="${r}"][data-f="${F[k+1]}"]`).focus();
  if(r===ROWS.length-1) addRow(); else $(`[data-r="${r+1}"][data-f="email"]`).focus();
});
function addRow(){ ROWS.push({email:"",password:"",perfil:"",pin:""}); renderAdd(); const l=$$all(`[data-f="email"]`); l[l.length-1].focus(); }
function $$all(s){return [...document.querySelectorAll(s)];}
function delRow(i){ ROWS.splice(i,1); renderAdd(); }
function pasteRows(){
  const lines=$("#pasteBox").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean); const out=[];
  for(const l of lines){ const c=(l.includes("\t")?l.split("\t"):l.includes("|")?l.split("|"):l.split(/:(.+)/)).map(x=>(x||"").trim()); if(c[0]&&c[1]) out.push({email:c[0],password:c[1],perfil:c[2]||"",pin:c[3]||""}); }
  if(!out.length) return toast("No encontré filas válidas (cuenta y contraseña)",true);
  ROWS=ROWS.filter(r=>r.email||r.password).concat(out); PASTE=false; renderAdd(); toast(`✔ ${out.length} fila(s) listas, revisa y guarda`);
}
async function saveRows(){
  const rows=ROWS.filter(r=>r.email||r.password||r.perfil||r.pin);
  const bad=rows.findIndex(r=>!r.email.trim()||!r.password.trim()); if(!rows.length) return toast("Escribe al menos una cuenta",true);
  if(bad>=0) return toast(`Fila ${bad+1}: falta la cuenta o la contraseña`,true);
  try{ const r=await api("/api/admin/inventario",{json:{pid:addPid,plan:aPlan,rows}}); ROWS=[{email:"",password:"",perfil:"",pin:""}]; renderAdd();
    toast(`✔ ${r.added} agregada(s)${r.skipped?` · ${r.skipped} repetida(s) omitida(s)`:""}`); loadInv(); }catch(e){ toast(e.message,true); }
}
async function loadInv(){ try{ INV=(await api("/api/admin/inventario")).items; renderInv(); }catch(e){ toast(e.message,true); } }
function renderInv(){
  const sum={}; INV.forEach(a=>{const s=sum[a.pid]=sum[a.pid]||{disponible:0,reservada:0,vendida:0,bloqueada:0}; s[a.status]++;});
  const tot={disponible:0,reservada:0,vendida:0,bloqueada:0}; INV.forEach(a=>tot[a.status]++);
  const seg=(s,n)=>["disponible","reservada","vendida","bloqueada"].map(k=>n?`<i style="width:${s[k]/n*100}%;background:${STC[k].c}"></i>`:"").join("");
  const st=$("#invStats"); if(!st) return;
  st.innerHTML=`<button class="stat ${!invPid?"on":""}" style="background:linear-gradient(135deg,#1b2757,#0b1020)" onclick="invPid='';renderInv()"><b>📦 Todas</b><div class="n">${tot.disponible}<small>libres</small></div><div class="sub">${tot.vendida} vendidas · ${INV.length} en total</div><div class="mbar">${seg(tot,INV.length)}</div></button>`+
   Object.entries(sum).map(([id,s])=>{const p=prod(id),n=s.disponible+s.reservada+s.vendida+s.bloqueada;
    return `<button class="stat ${invPid===id?"on":""}" style="background:linear-gradient(135deg,${p.c1},${p.c2})" onclick="invPid='${esc(id)}';renderInv()">${s.disponible===0?`<span class="tag">AGOTADO</span>`:s.disponible<=2?`<span class="tag w">POCO STOCK</span>`:""}<b>${esc(p.name)}</b><div class="n">${s.disponible}<small>libres</small></div><div class="sub">${s.vendida} vendidas${s.reservada?` · ${s.reservada} reservadas`:""}</div><div class="mbar">${seg(s,n)}</div></button>`;}).join("");
  const q=invQ.toLowerCase();
  const rows=INV.filter(a=>(!invPid||a.pid===invPid)&&(!invSt||a.status===invSt)&&(!q||(a.email+" "+a.perfil+" "+a.order+" "+a.plan).toLowerCase().includes(q)));
  $("#invChips").innerHTML=[["","Todas",INV.length],...Object.entries(STC).map(([k,v])=>[k,v.t+"s",tot[k]])].map(([k,l,n])=>`<button class="${invSt===k?"on":""}" onclick="invSt='${k}';renderInv()">${l} · ${n}</button>`).join("");
  rows.sort((a,b)=>pname(a.pid).localeCompare(pname(b.pid))||a.email.localeCompare(b.email)||a.perfil.localeCompare(b.perfil));
  const f=(ic,l,v,cls,id,fld)=>`<div class="fld ${v?"":"empty"}"><small>${ic} ${l}</small><code class="${cls||""}">${v?esc(v):"— sin dato —"}</code>${v?`<button class="cp" data-cp="${id}:${fld}" title="Copiar">📋</button>`:""}</div>`;
  $("#invList").innerHTML=rows.length?rows.map(a=>{const sc=STC[a.status].c,shown=REVEAL.has(a.id);
   return `<div class="acc" style="--sc:${sc}"><div class="acc-h"><b>${esc(pname(a.pid))}</b>${a.plan?`<small style="color:var(--muted)">· ${esc(a.plan)}</small>`:""}<span class="pill">${STC[a.status].t}</span>${a.order?`<small style="color:var(--muted)">pedido ${esc(a.order)}</small>`:""}</div>
    <div class="acc-f">${f("🔑","Cuenta",a.email,"",a.id,"email")}
      <div class="fld"><small>🔒 Contraseña</small><code class="pw">${shown?esc(a.password):"••••••••"}</code><button class="cp" data-cp="${a.id}:password" title="Copiar">📋</button><button class="cp" style="right:30px" onclick="togPw('${a.id}')" title="Mostrar/ocultar">${shown?"🙈":"👁"}</button></div>
      ${f("👤","Perfil",a.perfil,"",a.id,"perfil")}${f("#️⃣","PIN",a.pin,"pn",a.id,"pin")}</div>
    ${a.extra?`<small style="color:var(--muted)">📝 ${esc(a.extra)}</small>`:""}
    <div class="acc-a"><button class="btn sm" onclick="editInv('${a.id}')">✏️ Editar</button>
     ${a.status==="vendida"||a.status==="bloqueada"?`<button class="btn sm" onclick="setInv('${a.id}','disponible')">↩ Poner libre</button>`:`<button class="btn sm" onclick="setInv('${a.id}','bloqueada')">⛔ Bloquear</button>`}
     <button class="btn sm d" onclick="delInv('${a.id}')">🗑 Eliminar</button></div></div>`;}).join(""):`<p class="help">${INV.length?"Ninguna cuenta coincide con el filtro.":"Aún no hay cuentas. Agrega las primeras arriba. 👆"}</p>`;
}
function togPw(id){ REVEAL.has(id)?REVEAL.delete(id):REVEAL.add(id); renderInv(); }
$("#view").addEventListener("click",async e=>{ const b=e.target.closest("[data-cp]"); if(!b) return; const [id,f]=b.dataset.cp.split(":"); const a=INV.find(x=>x.id===id); if(!a) return;
  try{ await navigator.clipboard.writeText(a[f]); toast("📋 Copiado"); }catch(err){ toast("No se pudo copiar",true); } });
async function setInv(id,status){ try{ await api("/api/admin/inventario/"+id,{method:"PUT",json:{status}}); loadInv(); }catch(e){ toast(e.message,true); } }
async function delInv(id){ if(!confirm("¿Eliminar esta cuenta del inventario?")) return; try{ await api("/api/admin/inventario/"+id,{method:"DELETE"}); loadInv(); }catch(e){ toast(e.message,true); } }
function editInv(id){
  const a=INV.find(x=>x.id===id); if(!a) return; const p=prod(a.pid);
  $("#edBody").innerHTML=`<h2>✏️ Editar cuenta · ${esc(p.name)}</h2><div class="grid2">
    <label>🔑 Cuenta (correo)<input id="eE" value="${esc(a.email)}"></label><label>🔒 Contraseña<input id="eP" value="${esc(a.password)}"></label>
    <label>👤 Perfil<input id="eF" value="${esc(a.perfil)}"></label><label>#️⃣ PIN<input id="eN" value="${esc(a.pin)}"></label></div>
    <label>Plan<select id="eL"><option value="">Cualquier plan</option>${(p.plans||[]).map(pl=>`<option ${pl.l===a.plan?"selected":""}>${esc(pl.l)}</option>`).join("")}</select></label>
    <label>📝 Nota extra para el cliente (opcional)<input id="eX" value="${esc(a.extra)}"></label>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="$('#ed').close()">Cancelar</button><button class="btn p" onclick="saveInv('${id}')">Guardar</button></div>`;
  $("#ed").showModal();
}
async function saveInv(id){ try{ await api("/api/admin/inventario/"+id,{method:"PUT",json:{email:$("#eE").value,password:$("#eP").value,perfil:$("#eF").value,pin:$("#eN").value,extra:$("#eX").value,plan:$("#eL").value}}); $("#ed").close(); loadInv(); toast("✔ Guardado"); }catch(e){ toast(e.message,true); } }

/* ===================== PEDIDOS ===================== */
function vPedidos(){ return `<div class="card"><h2>🧾 Pedidos</h2><div id="ordTop"></div>
  <div class="bar" style="margin-top:12px"><button class="btn sm" onclick="loadOrd()">🔄 Actualizar</button><button class="btn sm" onclick="audit()">🛡 Auditar y reparar</button></div><div id="auditBox"></div>
  <div class="chips" id="ordChips"></div><div id="ordList">Cargando…</div></div>`; }
async function loadOrd(){
  try{ [ORD,INV]=await Promise.all([api("/api/admin/pedidos").then(r=>r.items),api("/api/admin/inventario").then(r=>r.items)]); }catch(e){ return toast(e.message,true); }
  renderOrd();
}
function renderOrd(){
  const el=$("#ordList"); if(!el) return; const byA=Object.fromEntries(INV.map(a=>[a.id,a]));
  const isP=o=>PROB.includes(o.status), isPend=o=>o.status==="pendiente", isOk=o=>o.status==="entregado";
  const cnt={todos:ORD.length,problemas:ORD.filter(isP).length,pendientes:ORD.filter(isPend).length,entregados:ORD.filter(isOk).length};
  const dia=Date.now()/1000-86400, vend=ORD.filter(o=>o.paid&&o.paid>dia).reduce((s,o)=>s+o.total,0);
  $("#ordTop").innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip ok">💰 Ventas 24 h: <b>${fmt(vend)}</b></span><span class="chip ${cnt.problemas?"bad":"ok"}">${cnt.problemas?"⚠ "+cnt.problemas+" con problema":"✔ Sin problemas"}</span><span class="chip">${cnt.pendientes} esperando pago</span></div>`;
  $("#ordChips").innerHTML=[["todos","Todos"],["problemas","⚠ Problemas"],["pendientes","Esperando pago"],["entregados","Entregados"]].map(([k,l])=>`<button class="${ordF===k?"on":""}" onclick="ordF='${k}';renderOrd()">${l} · ${cnt[k]}</button>`).join("");
  const rows=ORD.filter(o=>ordF==="todos"||(ordF==="problemas"&&isP(o))||(ordF==="pendientes"&&isPend(o))||(ordF==="entregados"&&isOk(o)));
  el.innerHTML=rows.length?rows.map(o=>{const st=OSL[o.status]||[o.status,""];
   const cu=o.items.flatMap(i=>(i.cuentas||[]).map(c=>byA[c]).filter(Boolean).map(a=>`<div class="fld" style="margin-top:6px"><small>${esc(pname(a.pid))}</small><code>${esc(a.email)} · ${esc(a.password)}${a.perfil?" · "+esc(a.perfil):""}${a.pin?" · PIN "+esc(a.pin):""}</code></div>`)).join("");
   return `<div class="acc" style="--sc:${st[1]==="ok"?"#8dff2e":st[1]==="bad"?"#ff6b7d":st[1]==="warn"?"#ffc14d":"#6f7ba6"}"><div class="acc-h"><b>${esc(o.ref)}</b><span class="pill">${st[0]}</span><small style="color:var(--muted)">${dt(o.created)}</small></div>
    <div><b>${fmt(o.total)}</b> · ${esc(o.email)}${o.nombre?" · "+esc(o.nombre):""}${o.cupon?" · cupón "+esc(o.cupon):""}</div>
    <small style="color:var(--muted)">${o.items.map(i=>`${i.qty}× ${esc(i.name)} (${esc(i.plan)})${i.manual?" 🖐 manual":""}`).join(" · ")}</small>
    ${cu}${o.error?`<small style="color:#ff6b7d">${esc(o.error)}</small>`:""}${o.via?`<small style="color:var(--muted)">Pago vía ${esc(o.via)} ${o.payment_id?"· "+esc(o.payment_id):""}</small>`:""}${o.notas?`<small>📝 ${esc(o.notas)}</small>`:""}
    <div class="acc-a">${o.paid?`<button class="btn sm" onclick="ordAct('${o.ref}','reenviar')">📧 Reenviar</button><button class="btn sm" onclick="if(confirm('¿Reenviar TODAS las cuentas del pedido, incluso las ya enviadas?'))ordAct('${o.ref}','reenviar',{todo:true})">📧 Reenviar todo</button>${o.status==="manual"?`<button class="btn sm" onclick="ordAct('${o.ref}','completar')">✔ Marcar completado</button>`:""}`
    :(["pendiente","error_bold","monto_distinto"].includes(o.status)?`<button class="btn sm" onclick="if(confirm('¿Confirmar el pago de este pedido a mano y entregar las cuentas?'))ordAct('${o.ref}','entregar')">✔ Confirmar pago manual</button><button class="btn sm d" onclick="ordAct('${o.ref}','cancelar')">✖ Cancelar</button>`:"")}</div></div>`;}).join(""):`<p class="help">No hay pedidos en esta vista.</p>`;
}
async function ordAct(ref,act,json={}){ try{ const r=await api(`/api/admin/pedidos/${ref}/${act}`,{json}); toast(r.ok===false?("⚠ "+(r.error||r.status||r.result||"No se pudo")):"✔ Listo",r.ok===false); }catch(e){ toast(e.message,true); } loadOrd(); }
async function audit(){
  try{ const r=await api("/api/admin/auditoria",{json:{}}); const b=$("#auditBox"); if(!b) return;
    b.innerHTML=`<div class="audit ${r.ok?"ok":"bad"}"><b>${r.ok?"✔ Todo en orden":"⚠ Hay cosas por revisar"}</b> <span class="help">(${r.revisados} pedidos revisados)</span>${r.fixes.map(x=>`<div>🔧 ${esc(x)}</div>`).join("")}${r.issues.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`; loadOrd(); }catch(e){ toast(e.message,true); }
}

/* ===================== PAGOS BOLD ===================== */
function vPagos(){ return `<div class="card"><h2>💳 Estado de la integración con Bold</h2><div id="pgInfo">Cargando…</div></div>
  <div class="card"><h2>📧 Probar envío de correo</h2><div class="grid2"><label>Enviar prueba a<input id="mTo" placeholder="tucorreo@gmail.com" type="email"></label></div><div style="margin-top:10px"><button class="btn" onclick="testMail()">Enviar correo de prueba</button></div></div>
  <div class="card"><h2>📡 Últimos eventos</h2><div id="pgEv" class="help">—</div></div>`; }
async function loadPagos(){
  try{ const e=await api("/api/admin/estado"); const el=$("#pgInfo"); if(!el) return; const c=(ok,t)=>`<span class="chip ${ok?"ok":"bad"}" style="margin:0 6px 6px 0">${ok?"✔":"✖"} ${t}</span>`;
    el.innerHTML=c(e.bold.api,"BOLD_API_KEY (crear links)")+c(e.bold.secret||e.bold.test,"BOLD_SECRET_KEY (firma del webhook)")+c(e.correo,"Envío de correo")+c(e.key_explicit,"INVENTORY_KEY propia")+c(!!e.public_url,"PUBLIC_URL")+(e.bold.test?`<span class="chip warn">Modo pruebas</span>`:"")
      +`<p class="help" style="margin-top:8px">URL del webhook para Bold:</p><code style="display:block;word-break:break-all;background:var(--card);padding:10px;border-radius:10px;margin-top:4px;user-select:all">${esc(e.bold.webhook)}</code>`
      +(!e.key_explicit?`<p class="help" style="margin-top:8px;color:#ffc14d">⚠ Sin INVENTORY_KEY las credenciales se cifran con una clave derivada de tu SECRET_KEY/ADMIN_PASSWORD y NO se respaldan en GitHub. Define INVENTORY_KEY.</p>`:"")
      +`<p class="help" style="margin-top:8px">Las cuentas se reservan ${e.reserva_min} min mientras el cliente paga.</p>`;
    $("#pgEv").innerHTML=e.eventos.length?e.eventos.map(v=>`<div>${dt(v.t)} · <b>${esc(v.kind)}</b> · ${esc(v.msg)}</div>`).join(""):"Sin eventos todavía."; }catch(e){}
}
async function testMail(){ try{ await api("/api/admin/correo-prueba",{json:{to:$("#mTo").value}}); toast("✔ Correo enviado, revisa tu bandeja"); }catch(e){ toast(e.message,true); } }

/* ===================== TEMAS ===================== */
function vTemas(){
  const c=DATA.config, cur=THEMES[c.tema]?c.tema:"neon", groups=[...new Set(Object.values(THEMES).map(t=>t.g))];
  const card=([id,T])=>{const k=T.c, lights=(T.deco&&T.deco.colors?T.deco.colors:[k.y,k.g,k.b]).slice(0,6);
    return `<div class="tcard2 ${id===cur?"on":""}"><div class="tprev" style="background:linear-gradient(135deg,${k.bg},${k.bg2})"><div class="fl" style="color:${k.y}">${T.deco&&T.deco.glyphs?esc(T.deco.glyphs.repeat(4)):""}</div>
      <div class="lt">${lights.map(x=>`<i style="background:${x};color:${x}"></i>`).join("")}</div>
      <span class="bt" style="background:${T.c.grad||`linear-gradient(95deg,${k.y},${k.g})`};color:${k.on}">Ver plataformas →</span><span class="em">${T.e}</span></div>
      <div class="tinfo"><b>${T.e} ${esc(T.n)} ${id===cur?`<span class="ok-badge">✔ Activa</span>`:""}</b><small class="help">${esc(T.d)}</small>
      <div class="tb"><a class="btn sm" href="/?tema=${id}" target="_blank" rel="noopener">👁 Vista previa</a>${id===cur?"":`<button class="btn sm p" onclick="setTema('${id}')">Usar esta</button>`}</div></div></div>`;};
  return `<div class="card"><h2>🎨 Plantilla que ve tu cliente</h2><p class="help">Elige la temática de tu tienda según la fecha. <b>Vista previa</b> la abre en otra pestaña tal como la verían tus clientes (sin cambiar nada). Cuando elijas una, pulsa <b>Publicar cambios</b>.</p>
    ${groups.map(g=>`<h3 class="gh">${esc(g)}</h3><div class="tgrid">${Object.entries(THEMES).filter(([,T])=>T.g===g).map(card).join("")}</div>`).join("")}</div>
  <div class="card"><h2>⚙️ Ajustes de la temática</h2>
    <label class="ck"><input type="checkbox" data-k="config.efectos" ${c.efectos!==false?"checked":""}> Efectos animados (nieve, corazones, murciélagos, confeti…)</label>
    <div style="margin-top:12px"><label>Mensaje de la barra superior para esta temática (vacío = el mensaje que trae la temática)<input data-k="config.tema_anuncio" value="${esc(c.tema_anuncio||"")}" placeholder="🎄 ¡Feliz Navidad! 20% en combos con el código NAVIDAD"></label></div>
    <div class="grid2" style="margin-top:12px"><label>Activar desde (opcional)<input type="date" data-k="config.tema_desde" value="${esc(c.tema_desde||"")}"></label><label>Hasta (opcional)<input type="date" data-k="config.tema_hasta" value="${esc(c.tema_hasta||"")}"></label></div>
    <p class="help" style="margin-top:8px">Con fechas, la temática se activa sola y después la tienda vuelve al diseño Neón MJ sin que hagas nada. Ej.: Navidad del 1 al 26 de diciembre.</p></div>`;
}
function setTema(id){ DATA.config.tema=id; mark(); render(); toast("Temática elegida. Pulsa «Publicar cambios» para aplicarla"); }

/* ---------- inicio ---------- */
(async()=>{ try{ await start(); }catch(e){ showLogin(); if(!/vencida|autorizado/i.test(e.message)) $('#lerr').textContent=e.message; } })();
</script>
